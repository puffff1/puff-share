    var S = st.left.prep, T = st.right.prep, p = st.plan, notes = [];
    var sf = p.fields.filter(function (f) { return f.role === 'sender'; })[0];
    if (!S.analysis.roles.content) notes.push('左边没认出哪个字段是消息正文，请在「字段对照」里给正文那一行选对字段。');
    if (sf && sf.mode !== 'source') notes.push('左边没认出每条消息是谁发的，现在所有消息会算成同一个人。请在「字段对照」的「谁发的」那一行选一下。');
    var unsure = sf && sf.vm ? sf.vm.filter(function (e) { return e.unsure; }) : [];
    if (unsure.length) notes.push('左边的发送者 ' + unsure.map(function (e) { return showVal(e.value, 16); }).join('、') + ' 没认出该对应右边的谁，请在「字段对照」的「谁发的」那一行确认。');
    if (p.fields.some(function (f) { return f.role === 'type' && f.vm && f.vm.some(function (e) { return e.unsure; }); })) notes.push('左边有的消息类型在示例里没出现过，先按示例里的普通消息处理了。示例文件里类型越全，对得越准。');
    if (T.jsonl) notes.push('示例是 .jsonl 文件。保存下来的是 .txt，导入前把扩展名改成 .jsonl。');
    st.res.warnings.forEach(function (w) { notes.push(w); });

    var tArr = Core.getPath(T.root, T.path), samp = [];
    for (var i = T.analysis.headCount; i < tArr.length && samp.length < 2; i++) if (Core.isObj(tArr[i])) samp.push(tArr[i]);
    h += '<p class="sub" style="margin-top:12px">' + st.res.count + ' 条消息已经改成 ' + esc(st.right.fileName) + ' 的格式。对比一下下面两栏的样子，没问题就保存。</p>' +
      '<div class="actions"><button class="primary" id="saveBtn">保存 ' + esc(cut(outName(), 30)) + '</button><button id="copyBtn">复制全部内容</button><span class="say" id="say" role="status"></span></div>';
    if (notes.length) h += '<ul class="notes">' + notes.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
    h += '<div class="compare"><figure><figcaption>示例里的消息</figcaption><pre>' + esc(pretty(samp)) + '</pre></figure>' +
      '<figure class="out"><figcaption>转换后的消息</figcaption><pre>' + esc(st.res.count ? pretty(st.res.msgs.slice(0, 2)) : '（没有消息）') + '</pre></figure></div>';
    box.innerHTML = h;
    if (dl.state === 'none') el('saveBtn').hidden = true;
  }

  var getText = function () { if (st.text === null) st.text = Core.serialize(st.res, st.right.prep); return st.text; };
  var say = function (t) { var s = el('say'); if (s) s.textContent = t; };

  /* 保存：通过查看器提供的下载能力；没有时退回普通下载或复制 */
  var framed = window.top !== window.self;
  var dl = { state: 'wait', api: null };
  var dlReady = (window.claude && typeof window.claude.use === 'function' ? window.claude.use('downloads') : Promise.resolve(null))
    .then(function (d) { return d || null; }, function () { return null; })
    .then(function (d) {
      dl.api = d; dl.state = d ? 'api' : (framed ? 'none' : 'link');
      var b = el('saveBtn'); if (b && dl.state === 'none') b.hidden = true;
      return d;
    });

  function save() {
    if (!st.res) return;
    var btn = el('saveBtn'), text, name = outName();
    try { text = getText(); } catch (e) { return say('生成文件时出错：' + e.message); }
    btn.disabled = true; say('正在准备文件…');
    dlReady.then(function (d) {
      if (d) return d.save({ filename: name, data: new Blob([text]) }).then(function () { say('已保存。'); }, function (e) {
        var c = e && e.code;
        if (c === 'declined') say('没有保存。');
        else if (c === 'rate_limited') say('保存窗口已经开着，或点得太快了，稍等再试。');
        else if (c === 'too_large') say('文件太大，这里存不了。可以用「复制全部内容」。');
        else { dl.state = 'none'; btn.hidden = true; say('这里不能直接保存文件，请用「复制全部内容」，再粘贴到一个 .json 文件里。'); }
      });
      if (framed) { btn.hidden = true; return say('这里不能直接保存文件，请用「复制全部内容」，再粘贴到一个 .json 文件里。'); }
      var a = document.createElement('a'), url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      say('已保存。');
    }).then(function () { btn.disabled = false; });
  }

  function copy() {
    if (!st.res) return;
    var text;
    try { text = getText(); } catch (e) { return say('生成内容时出错：' + e.message); }
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      say(ok ? '已复制，粘贴到一个 .json 文件里就可以导入。' : '复制没成功，浏览器不允许这里写剪贴板。');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { say('已复制，粘贴到一个 .json 文件里就可以导入。'); }, fallback);
    else fallback();
  }

  el('resultPanel').addEventListener('click', function (e) {
    if (e.target.id === 'saveBtn') save();
    else if (e.target.id === 'copyBtn') copy();
  });

})();
</script>
</body>
</html>
