name: Build resource index

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build _index.json
        run: node scripts/build-index.mjs
      - name: Commit index
        run: |
          if git diff --quiet _index.json; then
            echo "No index changes"
            exit 0
          fi
          if git log -1 --pretty=%B | grep -q '\[skip index\]'; then
            echo "Skip loop"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _index.json
          git commit -m "chore: rebuild resource index [skip index]"
          git push
